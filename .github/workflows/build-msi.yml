name: Build Windows MSI Installer

on:
  push:
    tags:
      - '[0-9][0-9][0-9][0-9].[0-9]*.[0-9]*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-msi:
    name: Build Windows MSI
    runs-on: windows-latest
    steps:
      # The syntagmax core is a submodule referenced over SSH in .gitmodules.
      # GitHub Actions has no SSH key, so rewrite github.com SSH remotes to
      # token-authenticated HTTPS before the submodule is fetched. SUBMODULE_TOKEN
      # is a PAT (or fine-grained token) with read access to the core repository;
      # it falls back to the workflow's GITHUB_TOKEN, which suffices when the core
      # lives in the same repository/owner and the token is granted access.
      - name: Configure Git to fetch submodules over HTTPS
        run: |
          git config --global url."https://x-access-token:${{ secrets.SUBMODULE_TOKEN || secrets.GITHUB_TOKEN }}@github.com/".insteadOf "git@github.com:"
          git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"

      - name: Checkout code (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.SUBMODULE_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          uv sync --frozen --group dev

      # Build via setup_freeze.py (NOT the bare `cxfreeze` command): the dynamic
      # Qt-plugin bundling (platforms/qwindows.dll, styles, SVG) and the MSI
      # shortcut table live in setup_freeze.py and are omitted by bare cxfreeze.
      # The frozen tree embeds the syntagmax core, so the installed application
      # never depends on a separately installed core or its version.
      - name: Build MSI package
        run: |
          uv run python setup_freeze.py bdist_msi

      - name: Upload MSI artifact
        uses: actions/upload-artifact@v4
        with:
          name: syntagmax-desktop-msi-${{ github.ref_name || 'dev' }}
          path: dist/*.msi

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.msi
          generate_release_notes: true
