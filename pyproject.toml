[project]
name = "syntagmax-desktop"
version = "0.1.0"
description = "Native desktop companion application for Syntagmax (read-only reviewer)."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "PySide6>=6.8",
    "gitpython>=3.1.44",
    "syntagmax",
]

[project.scripts]
syntagmax-desktop = "syntagmax_desktop.app:main"

[tool.uv.sources]
syntagmax = { path = "syntagmax", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/syntagmax_desktop"]

# cx_Freeze's `bdist_msi` uses the setuptools/distutils code path (not hatchling),
# so it needs an explicit resolver for the dynamic `readme` field. The MSI build
# does not require any PyPI link transformation, so the plain README is used here.
[tool.setuptools.dynamic]
readme = { file = ["README.md"], content-type = "text/markdown" }

# Windows packaging (R13, R1, R9a, E4 operational). The static metadata lives here;
# `setup_freeze.py` augments it with the dynamically resolved PySide6 Qt plugins
# (platforms/qwindows.dll, styles, SVG), which cannot be expressed as fixed paths
# because the PySide6 install location varies per machine.
[tool.cxfreeze]

# base = "gui" suppresses the console window so a double-click launch is windowless (R1).
[[tool.cxfreeze.executables]]
script = "src/syntagmax_desktop/app.py"
base = "gui"
target_name = "syntagmax-desktop"

[tool.cxfreeze.build_exe]
# Reuse the core's build_exe.packages, plus the Qt bindings and their shim.
packages = [
    "syntagmax",
    "syntagmax_desktop",
    "PySide6",
    "shiboken6",
    "babel",
    "click",
    "jinja2",
    "git",
    "mcp",
    "uvicorn",
    "polars",
    "pydantic",
    "benedict",
    "yaml",
    "rich",
    "ruamel",
    "lark",
]
excludes = ["tkinter", "unittest"]

[tool.cxfreeze.bdist_msi]
# A per-user install (all_users = false) keeps the MSI out of the forced-UAC path (E4).
# The upgrade_code is a fixed, newly minted GUID, deliberately distinct from the
# core's {06253457-3B2E-4FA7-9097-4712F2C507C3} so the two products never collide.
all_users = false
product_name = "Syntagmax Desktop"
upgrade_code = "{CA7AD7F2-157B-4AD6-B2B8-59A3C2F7EE13}"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 160
target-version = "py313"

[tool.ruff.format]
quote-style = "single"

[tool.ruff.lint]
select = ["E", "F", "W"]

[dependency-groups]
dev = [
    "pytest>=8.3.5",
    "pytest-qt>=4.4.0",
    "cx-freeze>=8.6.0",
    "ruff>=0.15.7",
]
